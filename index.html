<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Team Hub · Gestión de equipo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="logo">T</span><span>Team Hub</span></div>
    <nav id="nav">
      <a href="#/dashboard" data-v="dashboard">📊 <span>Resumen</span></a>
      <a href="#/org" data-v="org">🏢 <span>Organigrama</span></a>
      <a href="#/members" data-v="members">👥 <span>Miembros</span></a>
      <a href="#/chapters" data-v="chapters">🧩 <span>Chapters</span></a>
      <a href="#/grades" data-v="grades">🎖️ <span>Grados</span></a>
      <a href="#/reports" data-v="reports">📈 <span>Reportes</span></a>
    </nav>
    <div class="side-foot">
      <button class="btn ghost" id="btn-export">⬇ Exportar datos</button>
      <label class="btn ghost">⬆ Importar Excel/CSV/JSON<input type="file" id="file-import" accept=".xlsx,.xls,.csv,.json" hidden></label>
      <button class="btn ghost danger" id="btn-reset">↺ Restaurar demo</button>
    </div>
  </aside>
  <main id="main"></main>
</div>
<div id="modal" class="modal" hidden><div class="modal-box" id="modal-box"></div></div>
<div id="toast" class="toast" hidden></div>
<script src="app.js"></script>
</body>
</html>
